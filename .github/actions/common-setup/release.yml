name: Auto Release (Dev)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # 必须赋予写入权限才能创建 Release
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # 如果你的项目有 shadowJar 任务，建议改为 ./gradlew shadowJar
        run: ./gradlew build

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Development Build (Latest)"
          body: |
            ## 开发版自动构建
            本版本由 GitHub Actions 自动生成。
            - **分支**: `dev`
            - **提交信息**: ${{ github.event.head_commit.message }}
            - **构建时间**: ${{ github.event.head_commit.timestamp }}
            
            > 注意：此版本仅供测试使用。
          draft: false
          prerelease: true
          # 自动覆盖旧的 tag
          make_latest: true
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}